# jeil-nas-worker — Synology Container Manager 프로젝트(REQ-0102)
# 이 파일에는 경로·주소·비밀값을 적지 않는다. 전부 같은 폴더의 .env 에서 온다(.env.example 참조).
services:
  jeil-nas-worker:
    build: .
    image: jeil-nas-worker:n1.10        # 워커를 고치면 꼬리표도 올린다 — 같은 꼬리표면 Container Manager 가 옛 이미지를 다시 쓴다(2026-10-06 실제 발생)
    container_name: jeil-nas-worker
    hostname: jeil-nas-worker        # 심박(etl_meta.nas_heartbeat)에 찍히는 이름 — 고정하지 않으면 재생성마다 새 행이 생긴다
    restart: unless-stopped
    # 전용 네트워크를 만들지 않는다 — Docker 가 새 네트워크에 172.17~172.31 대역을 차례로 배정하는데,
    # 그 대역이 사내 PC 대역과 겹치면 NAS 가 그 PC 들로 가는 응답을 컨테이너 쪽으로 보내 **NAS 접속이 통째로 끊긴다**
    # (2026-10-02 실제 발생 — 172.20.0.0/16 이 사내 무선 대역과 겹침). 이미 있는 기본 브리지(docker0)를 쓴다.
    network_mode: bridge
    env_file: .env
    user: "${NAS_RUN_UID:-1000}:${NAS_RUN_GID:-1000}"   # 적재 폴더에 쓸 수 있는 계정(README §2 에서 확인)
    mem_limit: 512m
    cpu_shares: 256                  # Synology 커널은 cpus: 를 못 쓴다 — 우선순위만 낮춘다
    volumes:
      - "${NAS_HOST_DATA_DIR:?적재 폴더의 NAS 내부 경로를 .env 에 적으세요}:/data"   # 적재 폴더(바인드)
      - "${NAS_HOST_DOCS_DIR:?문서 폴더(부서·전사공유의 상위)의 NAS 내부 경로를 .env 에 적으세요}:/docs"   # 문서 폴더 — 조회는 읽기만 하고, 쓰는 곳은 부서 폴더의 「AI저장」 하나뿐이다(워커가 경로를 검사 · REQ-0108)
      - state:/state                 # 하루 1회 완료 표시·로그(컨테이너를 다시 만들어도 남는다)
    # ports: 없음 — 이 컨테이너는 아무 포트도 열지 않는다

volumes:
  state:
