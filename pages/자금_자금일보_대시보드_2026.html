<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자금일보 → 자금·경영 현황으로 통합됨</title>
<!-- 2026-09-09 통합(관리자 결정): 자금일보와 자금·경영 현황이 같은 원천(확정 매출·매입)을 쓰게 되면서
     두 화면의 내용이 겹쳤다. 자금·경영 현황(/work/cash-status)으로 합치고, 이 주소는 안내 후 넘긴다.
     파일을 지우지 않는 이유는 기존 북마크·문서 링크를 깨뜨리지 않기 위해서다. -->
<style>
  :root{ --navy:#1a2f4e; --navy2:#27457a; --accent:#2f6fb3; --muted:#666; --line:#d8dee8; --bg:#f4f6f9; --soft:#eef2f8; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:#222; background:var(--bg);
       display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
  .box{max-width:520px; background:#fff; border:1px solid var(--line); border-radius:14px;
       padding:38px 34px; text-align:center; box-shadow:0 4px 18px rgba(0,0,0,.07);}
  .ic{font-size:44px; line-height:1;}
  h1{font-size:19px; color:var(--navy); margin:14px 0 10px;}
  p{color:var(--muted); font-size:13.5px; line-height:1.75; margin:0 0 8px;}
  .why{background:var(--soft); border-left:4px solid var(--accent); border-radius:0 8px 8px 0;
       padding:12px 15px; margin:18px 0 22px; text-align:left; font-size:12.5px; color:#33425a;}
  a.go{display:inline-block; background:var(--navy); color:#fff; text-decoration:none;
       padding:11px 24px; border-radius:9px; font-size:14px; font-weight:700;}
  a.go:hover{background:var(--navy2);}
  .sub{font-size:12px; color:#99a2ad; margin-top:14px;}
</style>
</head>
<body>
<div class="box">
  <div class="ic">💰</div>
  <h1>자금일보는 「자금·경영 현황」으로 통합되었습니다</h1>
  <p>잠시 후 자동으로 이동합니다.</p>
  <div class="why">
    두 화면이 <b>같은 원천(확정 매출·매입)</b>을 쓰게 되면서 내용이 겹쳤습니다.
    월별 수입·지출·수지차와 상위 거래처는 통합 화면에서 그대로 보실 수 있습니다.<br>
    현금성자산·차입금·매출채권 등은 ERP 연계 준비 중이라 두 화면 모두 표시하지 않습니다.
  </div>
  <a class="go" href="/work/cash-status">자금·경영 현황 열기 →</a>
  <div class="sub">이 주소(<code>/work/cash-daily</code>)는 기존 북마크를 위해 유지됩니다.</div>
</div>
<script>
  // 사용자가 무슨 일이 일어났는지 읽을 시간을 준 뒤 넘긴다(즉시 이동하면 통합 사실을 모른 채 지나간다).
  setTimeout(function () { location.replace("/work/cash-status"); }, 4000);
</script>
</body>
</html>
