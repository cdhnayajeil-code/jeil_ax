<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.PAGE_KEY='item_search';</script>
<script src="/pages/_access-gate.js"></script>
<title>구매·자재팀 — 품목 존재/중복 조회</title>
<link rel="stylesheet" href="/app/lib/querybar.css">
<style>
  :root{
    --navy:#1a2f4e; --navy2:#27457a; --accent:#2f6fb3; --accent2:#4a8ed0;
    --red:#b3402f; --green:#2e7d52; --amber:#9a6b1f;
    --ink:#222; --muted:#666; --line:#d8dee8; --bg:#f4f6f9;
    --soft:#eef2f8; --softred:#fbeeec; --softgreen:#ecf5f0; --softamber:#faf3e4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; font-size:14px;}
  .demo-banner{background:var(--amber); color:#fff; text-align:center; font-size:12px; padding:6px 10px;}
  .page{max-width:880px; margin:0 auto; background:#fff; padding:34px 40px; box-shadow:0 2px 14px rgba(0,0,0,.08); min-height:100vh;}
  .head{border-bottom:3px solid var(--navy); padding-bottom:14px; margin-bottom:20px;}
  .head h1{font-size:22px; color:var(--navy);}
  .head .sub{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .badge{display:inline-block; font-size:11px; border-radius:10px; padding:2px 9px; font-weight:600;}
  .badge.g{background:var(--softgreen); color:var(--green);} .badge.a{background:var(--softamber); color:var(--amber);}
  .badge.b{background:var(--soft); color:var(--navy2);} .badge.r{background:var(--softred); color:var(--red);}
  /* 검색 */
  .searchbox{display:flex; gap:10px; margin:18px 0 10px;}
  .searchbox input{flex:1; border:2px solid var(--accent); border-radius:11px; padding:13px 18px; font-family:inherit; font-size:16px; outline:none;}
  .searchbox input:focus{border-color:var(--navy);}
  .searchbox button{background:var(--navy); color:#fff; border:none; border-radius:11px; padding:0 26px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;}
  .searchbox button:hover{background:var(--navy2);}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; align-items:center;}
  .chips span.lb{font-size:12px; color:var(--muted);}
  .chips button{background:#fff; border:1px solid var(--accent); color:var(--accent); font-size:12px; padding:5px 13px; border-radius:16px; cursor:pointer; font-family:inherit;}
  .chips button:hover{background:var(--accent); color:#fff;}
  /* 결과 */
  .result{margin-top:6px;}
  .verdict{border-radius:11px; padding:15px 20px; margin-bottom:14px; font-size:14.5px; display:flex; align-items:center; gap:12px;}
  .verdict .ic{font-size:26px;}
  .verdict.found{background:var(--softgreen); border:1.5px solid #bcd9c8;}
  .verdict.dup{background:var(--softred); border:1.5px solid #e5c0b9;}
  .verdict.none{background:var(--softamber); border:1.5px solid #e3d3ad;}
  .verdict b{color:var(--navy);}
  table{width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 4px;}
  th{background:var(--navy); color:#fff; padding:8px 11px; text-align:left; font-weight:600;}
  td{padding:8px 11px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:nth-child(even) td{background:#fafbfd;}
  td.c,th.c{text-align:center;}
  .code{font-family:Consolas,monospace; font-size:12px; color:var(--navy2); font-weight:700;}
  tr.rep td{background:var(--softgreen) !important;}
  .hint{font-size:12px; color:var(--muted); margin:8px 0 0;}
  .empty{text-align:center; color:var(--muted); padding:36px 16px; font-size:13.5px; border:1.5px dashed var(--line); border-radius:11px;}
  .src{margin-top:22px; background:var(--soft); border:1px solid var(--line); border-radius:9px; padding:11px 16px; font-size:11.5px; color:var(--muted);}
  .src b{color:var(--navy2);}
  code{font-family:Consolas,monospace; font-size:11px; background:#fff; border:1px solid var(--line); border-radius:4px; padding:0 5px;}
  .foot{margin-top:24px; padding-top:12px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); display:flex; justify-content:space-between;}
  @media print{ .demo-banner{display:none;} .page{box-shadow:none; max-width:100%;} }
  @media (max-width:700px){ .page{padding:22px 16px;} .searchbox{flex-direction:column;} .searchbox button{padding:12px;} }
</style>
</head>
<body>
<div class="page">

  <div class="head">
    <h1>🔍 품목 존재/중복 조회<span class="qbar-period" data-qbar-period></span></h1>
    <div class="sub">설계·생산·사업관리팀 운영 페이지 · <span class="badge b">주관: 설계 · 생산 · 사업관리</span> <span class="badge g">공유: 구매 · 자재</span>
      — 신규 등록·BOM 작성·발주 의뢰 전에 품명·코드·규격으로 <b>기존 등록 여부</b>를 먼저 확인하세요.</div>
  </div>

  <!-- 표준 조회 플랫폼 (app/lib/querybar.js) — 기간 축이 없는 검색형 화면 -->
  <div id="qbar"></div>

  <div class="searchbox">
    <input type="text" id="q" placeholder="품명 · 품목코드 · 규격 입력  (예: 육각볼트, BOLT, 베어링)" autocomplete="off">
    <button id="btnSearch">조회</button>
  </div>

  <div class="result" id="result">
    <div class="empty">품명이나 코드를 입력하면 ERP에 등록된 품목과 <b>동일 규격 중복</b>을 보여줍니다.</div>
  </div>

  <div class="foot">
    <span>설계·생산·사업관리팀 운영 페이지 · 품목 존재/중복 조회</span>
    <span>공개범위: 지정 부서 공유</span>
  </div>
</div>

<script type="module">
  import { erpApi } from "/app/lib/api.js";
  import { createQueryBar } from "/app/lib/querybar.js";

  const host = document.getElementById("result");
  const input = document.getElementById("q");
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // 규격이 같은데 코드가 다르면 중복 후보다. 공백·곱셈기호 표기 차이는 무시하고 비교한다.
  const specKey = (r) => String(r.spec || "").replace(/[\s×xX*・·]/g, "").toUpperCase();

  // 규격이 품목명을 앞에 그대로 달고 있는 경우가 많다
  //   "기계배관용튜빙, Φ15X1.0T, SUS"  ·  "튜빙 고정 BRACKET Φ8, 홀 1개"
  // 콤마가 있든 없든 앞의 이름 부분을 떼어 규격만 남긴다(공백 표기가 달라도 맞춘다).
  function cleanSpec(name, spec) {
    let t = String(spec || "").trim();
    if (!t) return "";
    const squash = (x) => String(x || "").replace(/\s+/g, "");
    const n = squash(name);
    if (!n || !squash(t).startsWith(n)) return t;
    let i = 0, c = 0;
    while (i < t.length && c < n.length) { if (!/\s/.test(t[i])) c++; i++; }
    return t.slice(i).replace(/^[\s,·\-]+/, "").trim();
  }

  async function search() {
    const kw = (input.value || "").trim();
    if (!kw) {
      host.innerHTML = '<div class="empty">품명이나 코드를 입력하면 ERP에 등록된 품목과 <b>동일 규격 중복</b>을 보여줍니다.</div>';
      return;
    }
    host.innerHTML = '<div class="empty">조회 중…</div>';
    let rows;
    try { rows = await erpApi.items(kw, 200); }
    catch (e) {
      host.innerHTML = '<div class="empty">품목을 조회하지 못했습니다. 사내 계정으로 로그인했는지 확인해 주세요.<br>'
        + '<span style="font-size:12px;color:#99a2ad;">' + esc(e?.message || "") + '</span></div>';
      throw e;
    }

    if (!rows.length) {
      host.innerHTML = '<div class="verdict none"><span class="ic">🆕</span><div>'
        + '<b>"' + esc(kw) + '" 미등록</b> — 일치하는 품목이 없습니다.<br>'
        + '<span style="font-size:12.5px;color:var(--muted);">신규 등록을 진행하세요. 규격·단위를 정확히 입력하면 이후 중복을 예방할 수 있습니다.</span>'
        + '</div></div>';
      return;
    }

    const groups = {};
    for (const r of rows) { const k = specKey(r); if (!k) continue; (groups[k] = groups[k] || []).push(r); }
    const dup = Object.values(groups).filter((g) => g.length > 1).sort((a, b) => b.length - a.length);
    const dupCodes = new Set(dup.flat().map((r) => r.item_code));

    const head = dup.length
      ? '<div class="verdict dup"><span class="ic">⚠️</span><div>'
        + '<b>등록 존재 — 동일 규격 중복 ' + dup.length + '개 그룹</b> (검색 ' + rows.length + '건)<br>'
        + '<span style="font-size:12.5px;color:var(--muted);">같은 규격이 여러 코드로 등록돼 있습니다. <b>신규 코드를 만들기 전에</b> 아래 표에서 기존 코드를 확인하세요.</span>'
        + '</div></div>'
      : '<div class="verdict found"><span class="ic">✅</span><div>'
        + '<b>등록 존재</b> (검색 ' + rows.length + '건)<br>'
        + '<span style="font-size:12.5px;color:var(--muted);">동일 규격 중복은 발견되지 않았습니다.</span></div></div>';

    // 중복 그룹을 위로 올려 보여준다
    const ordered = [...dup.flat(), ...rows.filter((r) => !dupCodes.has(r.item_code))];

    const table = '<table><tr><th style="width:16%;">품목코드</th><th style="width:26%;">품명</th><th>규격</th><th class="c" style="width:8%;">단위</th><th class="c" style="width:8%;">상태</th></tr>'
      + ordered.slice(0, 80).map((r) => {
          const isDup = dupCodes.has(r.item_code);
          return '<tr' + (isDup ? ' style="background:var(--softred);"' : '') + '>'
            + '<td><b>' + esc(r.item_code) + '</b>' + (isDup ? ' <span class="badge r">중복</span>' : '') + '</td>'
            + '<td>' + esc(r.item_name || "—") + '</td>'
            + '<td style="color:var(--muted);">' + esc(cleanSpec(r.item_name, r.spec) || "—") + '</td>'
            + '<td class="c">' + esc(r.unit || "—") + '</td>'
            + '<td class="c">' + (String(r.use_yn).toUpperCase() === "N" ? "중지" : "사용") + '</td></tr>';
        }).join("")
      + '</table>';

    const more = ordered.length > 80
      ? '<p class="hint">검색어와 일치하는 품목이 많습니다 — 위 80건만 표시했습니다. 검색어를 더 좁혀 주세요.</p>' : "";

    host.innerHTML = head + table + more;
  }

  document.getElementById("btnSearch").onclick = search;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

  createQueryBar("#qbar", {
    months: false,                                   // 기간 축이 없는 조회 화면
    basis: "ERP 품목 마스터 · 코드·품명 부분일치",
    mode: "live",
    onQuery: () => search(),
  });
</script>

</body>
</html>
