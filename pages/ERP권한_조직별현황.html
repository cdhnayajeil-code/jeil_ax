<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.PAGE_KEY='erp_role_matrix';</script>
<script src="/pages/_access-gate.js"></script>
<title>ERP 권한(role) 조직별 현황</title>
<link rel="stylesheet" href="/app/lib/querybar.css">
<style>
:root{
  --navy:#1a2f4e; --navy2:#27457a; --accent:#2f6fb3; --accent2:#4a8ed0;
  --red:#b3402f; --green:#2e7d52; --amber:#9a6b1f; --grey:#5f6b7a;
  --ink:#222; --muted:#666; --line:#d8dee8; --bg:#f4f6f9;
  --soft:#eef2f8; --softred:#fbeeec; --softgreen:#ecf5f0; --softamber:#faf3e4; --softgrey:#f1f3f6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
  font-size:14px;line-height:1.5}
.page{max-width:1560px;margin:0 auto;padding:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:12px}
.head h1{margin:0;font-size:21px;color:var(--navy)}
.head .sub{margin-top:4px;color:var(--muted);font-size:12.5px}
.head .right{color:var(--muted);font-size:12.5px;text-align:right}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;margin-left:4px;
  border:1px solid var(--line);background:#fff}
.badge.b{color:var(--accent);border-color:var(--accent2);background:var(--soft)}
.badge.a{color:var(--amber);border-color:#dcc48a;background:var(--softamber)}

.notice{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;color:var(--muted)}
.notice.warn{border-color:#dcc48a;background:var(--softamber);color:#7a5514}
.loading{padding:40px;text-align:center;color:var(--muted)}
.foot{margin-top:16px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}

.gate{max-width:560px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:34px 26px}
.gate .ic{font-size:40px}
.gate h2{margin:10px 0 6px;font-size:18px;color:var(--navy)}
.gate p{color:var(--muted);margin:0 0 14px}
.gate button{padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:6px;cursor:pointer;font-size:13px}

.layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:9px}
.card > h3{margin:0;padding:9px 12px;font-size:13px;color:var(--navy);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card > h3 .sm{font-weight:400;color:var(--muted);font-size:11.5px}

/* 조직 트리 — 인원 없는 조직은 아예 그리지 않는다(체크박스 없음) */
.tree{max-height:72vh;overflow:auto;padding:5px 0}
.tnode{display:flex;align-items:center;gap:5px;padding:3px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.tnode:hover{background:var(--soft)}
.tnode.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.tnode.locked{color:#a3adba;cursor:not-allowed}
.tnode.locked:hover{background:transparent}
.tnode.hit{background:#fff8dd}
.tnode .tw{width:20px;flex:0 0 20px;height:20px;line-height:18px;color:var(--navy2);font-size:14px;
  font-weight:700;text-align:center;border:1px solid var(--line);border-radius:5px;background:#fff}
.tnode .tw.leaf{border-color:transparent;background:transparent;color:#c3cad4;font-weight:400}
.tnode .tw:hover{background:var(--soft);border-color:var(--accent2)}
.tnode .mp{width:20px;flex:0 0 20px;height:20px;line-height:18px;text-align:center;font-size:13px;
  font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:5px;background:#fff}
.tnode .mp:hover{background:var(--soft);border-color:var(--accent2)}
.tmem{display:flex;align-items:center;gap:6px;padding:2px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.tmem:hover{background:var(--soft)}
.tmem .nm{color:var(--ink)}
.tmem .sp{flex:1 1 auto}
.tnode .nm{overflow:hidden;text-overflow:ellipsis}
.tnode .sp{flex:1 1 auto}
.tnode .cnt{color:var(--muted);font-size:11.5px}
.tfootnote{border-top:1px solid var(--line);padding:7px 11px;color:var(--muted);font-size:11.5px;line-height:1.7}

.sum{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:10px 12px;
  border-bottom:1px solid var(--line);font-size:13px}
.sum .si{color:var(--navy);font-weight:700;white-space:nowrap}
.sum .si b{color:var(--muted);font-weight:600;font-size:12px;margin-right:4px}
.sum .sp{flex:1 1 auto}
.sum .sr{color:var(--muted);font-size:12px;font-weight:400;white-space:nowrap}

.tabs{display:flex;gap:2px;padding:0 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:7px 14px;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;
  cursor:pointer;font-size:12.5px;color:var(--muted);margin-bottom:-1px}
.tab.on{background:#fff;border-color:var(--line);color:var(--navy);font-weight:700}
.pane{padding:11px}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--navy);font-weight:700;white-space:nowrap}
td.r{text-align:right} td.c{text-align:center}
tr.click{cursor:pointer}
tr.click:hover > td{background:var(--soft)}
tr.lead > td:first-child{font-weight:700}
.chip{display:inline-block;padding:1px 7px;margin:2px 3px 2px 0;border-radius:10px;font-size:11.5px;
  border:1px solid var(--line);background:#fff;white-space:nowrap;cursor:pointer}
.chip:hover{background:var(--soft)}
.chip.flat{cursor:default}
.chip .w{opacity:.6;font-size:10.5px;margin-left:3px}
.grp{margin:7px 0 2px;font-size:11.5px;color:var(--muted);font-weight:700}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tools button{padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;
  cursor:pointer;font-size:12px;color:var(--navy)}
.tools button:hover{background:var(--soft)}
.tools button.on{background:var(--soft);border-color:var(--accent2);color:var(--accent);font-weight:700}
.tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.legend{font-size:11.5px;color:var(--muted)}

/* Role × 구성원 매트릭스 — .mx__ 스코프만 쓴다(전역 table 재정의 금지, §13.4) */
.mx__wrap{overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:7px}
.mx__wrap table{font-size:12px;border:none}
.mx__wrap th{position:sticky;top:0;z-index:3}
.mx__wrap th.mx__fix,.mx__wrap td.mx__fix{position:sticky;left:0;background:#fff;z-index:2;min-width:250px}
.mx__wrap th.mx__fix{z-index:4;background:var(--soft)}
.mx__wrap td.mx__n{text-align:center;min-width:32px}
.mx__wrap tr.mx__gap > td{border-top:2px solid var(--navy2)}
.mx__wrap tbody tr:hover > td{background:var(--soft)}
.mx__wrap tfoot td{position:sticky;bottom:0;background:var(--soft);font-weight:700}
.mx__o{color:var(--navy2);font-weight:700} .mx__m{color:#ccd3dc}
.mx__wrap td.mx__fix{cursor:pointer}

/* 눈에 띄어야 할 줄만 — 왼쪽 띠와 작은 꼬리표로만 표시한다.
   행 전체를 칠하면 매트릭스가 읽히지 않아서, 색은 최소로 쓴다. */
.mx__wrap td.mx__fix.f1{box-shadow:inset 3px 0 0 var(--amber)}
.mx__tag{display:inline-block;margin-left:5px;padding:0 5px;border-radius:9px;
  font-size:10.5px;font-weight:700;border:1px solid;white-space:nowrap}
.mx__tag.f1{color:var(--amber);border-color:#dcc48a;background:var(--softamber)}
.mx__wrap td.mx__n.h1{background:var(--softamber)}
.mx__hint{display:flex;gap:7px 14px;align-items:center;flex-wrap:wrap;
  margin:0 0 8px;font-size:11.5px;color:var(--muted);line-height:1.6}
.mx__hint .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.mx__hint .k.f1{background:var(--amber)}
.mx__hint .mx__note{color:var(--muted);font-size:11px}
.mx__hint b{color:var(--ink)}
.mx__wrap th.mx__n .mx__dp{display:block;font-weight:400;font-size:9.5px;color:var(--muted);
  margin-top:2px;white-space:nowrap}
.tsearch{margin:0 9px 6px;padding:5px 8px;border-radius:6px;background:var(--soft);
  font-size:11px;color:var(--muted)}
.tsearch b{color:var(--accent)}
.mn .vr{margin-left:5px;padding:0 4px;border:1px solid var(--line);border-radius:7px;
  font-size:9.5px;color:var(--muted);background:var(--softgrey)}
.mn .cd{color:var(--muted);font-size:11px}

/* 전체 권한 조회 — 조직과 무관하게 Role 과 메뉴를 훑어보는 패널 */
.rc__btn{border-color:var(--accent);color:var(--accent);font-weight:700}
.rc__wrap{display:grid;grid-template-columns:minmax(320px,2fr) 3fr;gap:12px;align-items:start}
.rc__bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.rc__bar input{padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.rc__gt{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.rc__gt button{padding:2px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font-size:11px;color:var(--muted);cursor:pointer}
.rc__gt button.on{background:var(--navy2);border-color:var(--navy2);color:#fff;font-weight:700}
.rc__list{max-height:min(62vh,620px);overflow:auto;border:1px solid var(--line);border-radius:7px}
.rc__list .it{display:flex;gap:7px;align-items:baseline;padding:6px 9px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.rc__list .it:last-child{border-bottom:none}
.rc__list .it:hover{background:var(--soft)}
.rc__list .it.on{background:var(--softgreen)}
.rc__list .it .nm{flex:1 1 auto;font-size:12.5px}
.rc__list .it .n{font-size:11px;color:var(--muted);white-space:nowrap}
.rc__det{max-height:min(62vh,620px);overflow:auto}
.mx__wrap td.mx__n input{cursor:pointer;margin:0}

/* 권한정리 */
.cl__bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 11px;margin-bottom:9px;
  border:1px solid var(--line);border-radius:7px;background:var(--soft)}
.cl__bar input[type=text]{padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.cl__bar .go{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}
.cl__bar .go[disabled]{opacity:.45;cursor:not-allowed}
.cl__ok{border:1px solid #a9d3bd;background:var(--softgreen);color:#1c6b45;border-radius:7px;
  padding:9px 12px;margin-bottom:9px}
.cl__cf{display:flex;align-items:center;gap:10px;border:1px solid #a9d3bd;background:var(--softgreen);
  color:#1c6b45;border-radius:7px;padding:9px 12px;margin-bottom:9px;font-size:13px}
.cl__cf .ic{font-size:17px}
.cl__cf .sp{flex:1 1 auto}
.cl__cf button{padding:4px 12px;border:1px solid var(--green);background:#fff;color:var(--green);
  border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:700}
.cl__cf button:hover{background:var(--softgreen)}
.cl__lock{opacity:.55;pointer-events:none}
/* 이미 정리 요청을 올린 권한 — 줄 전체를 눌러 두고 더 고르지 못하게 한다 */
.mx__wrap tr.cl__done > td{background:var(--softgreen)!important;color:#4b6b5c}
.mx__wrap tr.cl__done td.mx__fix{box-shadow:inset 3px 0 0 var(--green)}
.cl__done .mx__tag{opacity:.45}
.cl__dn{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;font-size:10.5px;
  font-weight:700;color:var(--green);border:1px solid #a9d3bd;background:#fff;white-space:nowrap}
.cl__help{padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;
  color:var(--navy2);font-size:12px;text-decoration:none;white-space:nowrap}
.cl__help:hover{border-color:var(--accent);color:var(--accent)}
.cl__x{margin-left:6px;padding:1px 8px;border:1px solid #e3b3aa;border-radius:6px;
  background:#fff;font-size:11px;cursor:pointer;color:var(--red);font-weight:700}
.cl__x:hover{background:var(--softred)}
.cl__x[disabled]{opacity:.4;cursor:not-allowed}

/* Role 상세 팝업 */
.ov{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.mo{background:#fff;border-radius:10px;width:min(980px,100%);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mo.wide{width:min(1340px,100%);max-height:92vh}
@media (max-width:900px){.rc__wrap{grid-template-columns:1fr}}
.mo > header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:flex-start;gap:12px}
.mo h4{margin:0;font-size:15px;color:var(--navy)}
.mo .x{border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.mo > .body{padding:13px 16px;overflow:auto}
.mo .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.mo .cols{grid-template-columns:1fr}}
.mtree{border:1px solid var(--line);border-radius:7px;max-height:54vh;overflow:auto}
.mrow{display:flex;align-items:center;gap:8px;padding:3px 9px;font-size:12.5px;border-bottom:1px solid #f0f3f7}
.mrow:last-child{border-bottom:none}
.mrow .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sp{flex:1 1 auto}
.act{font-size:10.5px;padding:0 6px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.act.A{color:var(--red);background:var(--softred);border-color:#e3b3aa}
.act.E{color:var(--accent);background:var(--soft);border-color:var(--accent2)}
.act.Q{color:var(--grey);background:var(--softgrey)}
</style>
</head><body>
<div class="page">
  <div class="head">
    <div>
      <h1>🔑 ERP 권한(role) 조직별 현황</h1>
      <div class="sub">
        조직도에서 조직을 고르면 구성원·권한이 보입니다 · Role 을 누르면 <b>메뉴 권한</b>까지 열립니다
        <span class="badge a" id="bScope">열람범위 확인 중</span>
      </div>
    </div>
    <div class="right">
      <button class="rc__btn" id="bCat" title="조직과 상관없이 ERP 권한(Role)과 그 메뉴를 훑어봅니다">📖 전체 권한 조회</button>
      <div style="margin-top:6px">ERP 권한 마스터 · <span data-qbar-asof>—</span> 기준</div>
    </div>
  </div>

  <div id="qbar" hidden></div>
  <div id="app"><div class="loading">권한 현황을 불러오는 중…</div></div>
  <div id="modal"></div>

  <div class="foot">
    <span>제일엠앤에스 AI 포털 · ERP 권한 조직별 현황</span>
    <span>주관: 관리자 전용 · 정본 SQL <code>50_erp_role_matrix.sql</code> · <code>51_erp_role_menu.sql</code></span>
  </div>
</div>

<script type="module">
  import { supabase } from "/app/lib/supabaseClient.js";
  import { erpApi } from "/app/lib/api.js";
  import { createQueryBar } from "/app/lib/querybar.js";

  const $   = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const num = (n) => Number(n || 0).toLocaleString("ko-KR");
  const LEAD = ['대표','부문장','법인장','팀장'];   // 구성원 목록에서 앞에 세울 직책(그룹웨어 직책 토큰)
  const UNASSIGNED = '__unassigned__';

  /* ── 사내(internal) 세션 게이트 — pages/자금현황_대시보드.html 과 동일 패턴 ────────────
     /pages/_access-gate.js 는 Entra 토큰만 본다. Supabase 세션이 없으면 게이트는 통과하고
     RPC 만 조용히 28000 이 되므로, 화면이 세션을 직접 확인해야 한다.                     */
  function claimsOf(session){
    if(!session || !session.access_token) return {};
    try{
      let p = session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''))).app_metadata || {};
    }catch(e){ return {}; }
  }
  function autoSSO(){
    const u = new URL(location.href); u.searchParams.set('sso','1');
    supabase.auth.signInWithOAuth({ provider:'azure', options:{ scopes:'openid email profile', redirectTo:u.toString() } });
  }
  function gate(icon, title, msg, btn){
    $("qbar").hidden = true;
    $("app").innerHTML = '<div class="gate"><div class="ic">'+icon+'</div><h2>'+esc(title)+'</h2><p>'+msg+'</p>'
      + (btn ? '<button id="gsso">'+esc(btn)+'</button>' : '') + '</div>';
    const b = $("gsso"); if(b) b.onclick = async () => { try{ await supabase.auth.signOut(); }catch(e){} autoSSO(); };
  }

  /* ── 상태 ── */
  let BAR = null;
  let TREE = null;     // erp_role_org_tree
  let DETAIL = null;   // erp_role_dept_detail(선택 조직)
  let ROLES = null;    // erp_role_list(전사) — 권한별 탭 + 권한/메뉴 검색
  let SEL = null, TAB = "matrix";       // 관리자 지시 — 매트릭스를 가장 앞에 둔다
  let OPEN = new Set(), OPENED = false;
  const MEMOPEN = new Set();            // 조직도에서 인원까지 펼친 부서
  const EXPANDED = new Set();
  const RCACHE = new Map();   // role_id → 상세(메뉴·보유자)
  let ROLEMOD = 'all';        // 권한별 탭 모듈 필터
  let ROLEDEPT = true;        // 권한별 탭은 선택 조직만 — 전사는 「전체 권한 조회」가 맡는다
  let PICK = new Map();       // 권한정리 — 제외 담기 (key: email|role_id)
  let CLCONFIRM = '', CLNOTE = '', CLDONE = null, CLLOG = null, CLBUSY = false;

  async function boot(){
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){
      if(!new URLSearchParams(location.search).get('sso')){ autoSSO(); return; }
      return gate('🔐','사내 로그인이 필요합니다',
        'ERP 권한 현황은 사내(@jeilm.co.kr) 계정으로 로그인해야 볼 수 있습니다.','사내 계정으로 로그인');
    }
    if(claimsOf(session).role !== 'internal'){
      return gate('🔒','사내 전용 화면',
        '현재 협력사(또는 권한 없는) 계정으로 로그인되어 있어 표시할 수 없습니다.','사내 계정으로 다시 로그인');
    }

    $("qbar").hidden = false;
    BAR = createQueryBar("#qbar", {
      // 기간 축 없음 — usr_role_s 에 부여일자 컬럼이 없다. 고를 수 없는 기간을 만들지 않는다(§16.6).
      months: false,
      // 기준·모드 배지와 「최종 조회」 시각은 뺀다(2026-09-21 관리자 지시) —
      // 기간 축이 없는 화면이라 알려 줄 게 없고, 같은 정보가 머리말에 이미 있다.
      meta: false, stamp: false,
      reset: true, refreshLabel: "다시 조회",
      extras: [
        { id:"q",     label:"이름·부서", type:"text", placeholder:"사람 이름 또는 부서명", width:"175px", debounce:250 },
        { id:"rq",    label:"권한(Role)", type:"text", placeholder:"Role명 또는 ID",       width:"175px", debounce:350 },
        { id:"child", label:"하위부서 포함", type:"checkbox", value:false },
      ],
      onQuery: (q, ctx) => run(q, ctx),
    });
    $("bCat").onclick = () => openCatalog();
  }

  let LAST = { dept:null, child:null, rq:null };
  async function run(q, ctx){
    const reason = ctx && ctx.reason;
    const ex = (q && q.extras) || {};
    const child = !!ex.child;
    const rq = String(ex.rq || '').trim();
    try{
      if(!TREE || reason === 'refresh' || reason === 'auto'){
        const t = await erpApi.erpRoleOrgTree();
        if(t && t.forbidden) return gate('🔒','열람 권한이 필요합니다',
          'ERP 권한 현황은 <b>관리자</b>이거나, 관리자에게 <b>페이지 권한(erp_role_matrix)</b>을 받은 사용자만 볼 수 있습니다.<br>'
          + '부서장 열람은 <b>부서 범위(perm_grant · dept)</b>도 함께 필요합니다.', null);
        if(t && t.unauthorized) return gate('🔐','인증 필요','세션이 만료되었습니다. 다시 로그인하세요.','다시 로그인');
        if(!t || !t.ok) return gate('⚠','데이터 없음','표시할 조직 데이터가 없습니다.', null);
        TREE = t;
        if(BAR) BAR.setMeta({ asOf: asOfLabel(t.as_of) });
        $("bScope").className = 'badge ' + (t.is_admin ? 'b' : 'a');
        $("bScope").textContent = t.is_admin ? '열람범위: 전 조직 (관리자)'
          : '열람범위: 지정 부서 ' + ((t.visible_dept_cds || []).length) + '곳';
        if(!OPENED) initOpen();
        if(!SEL) SEL = pickDefault();
      }

      // 권한·메뉴 검색은 서버가 판단한다 — 메뉴명은 role_menu 6,633행 × menu_master 3,560행 조인이라
      // 화면으로 내려보낼 수 없다.
      if(!ROLES || LAST.rq !== rq || reason === 'refresh' || reason === 'auto'){
        // 메뉴명 검색은 조회조건에서 뺐다(2026-09-21 관리자 지시) — 「전체 권한 조회」가 맡는다
        const r = await erpApi.erpRoleList({ q: rq || null });
        ROLES = (r && r.ok) ? r : { ok:false, roles:[] };
        LAST.rq = rq;
      }

      if(SEL && (LAST.dept !== SEL || LAST.child !== child || reason === 'refresh' || reason === 'auto')){
        const d = await erpApi.erpRoleDeptDetail(SEL, { includeDesc: child });
        DETAIL = (d && d.forbidden) ? { forbidden:true } : ((d && d.ok) ? d : null);
        LAST.dept = SEL; LAST.child = child;
        CLLOG = null; CLDONE = null;      // 부서가 바뀌면 정리 내역도 다시 읽는다
      }
      render(ex);
    }catch(e){
      console.error(e);
      $("app").innerHTML = '<div class="notice">권한 현황을 불러오지 못했습니다. 사내 계정으로 로그인했는지 확인해 주세요.<br><small>'+esc(e.message||e)+'</small></div>';
      throw e;
    }
  }

  function asOfLabel(a){
    if(!a) return null;
    const d = (x) => x ? String(x).slice(0,10) : null;
    const erp = d(a.usr_role), gw = d(a.groupware);
    if(erp && gw && erp !== gw) return erp + ' · GW ' + gw;
    return erp || gw || null;
  }

  const nodes = () => (TREE && TREE.nodes) || [];
  function byCd(cd){
    if(cd === UNASSIGNED) return { dept_cd:UNASSIGNED, dept_nm:'외부', visible: !!(TREE && TREE.is_admin) };
    return nodes().find(n => n.dept_cd === cd) || null;
  }
  // 인원 없는 조직(원가부서·빈 법인)은 그리지 않는다 — 토글 없이 항상 제외
  const shownNodes = () => nodes().filter(n => (n.member_cnt_desc || 0) > 0);

  function initOpen(){
    OPENED = true;
    nodes().forEach(n => { if(n.lvl <= 2 && n.has_child) OPEN.add(n.dept_cd); });
  }
  function pickDefault(){
    const vis = shownNodes().filter(n => n.visible && (n.member_cnt || 0) > 0);
    vis.sort((a,b) => (b.member_cnt||0) - (a.member_cnt||0));
    return vis.length ? vis[0].dept_cd : (nodes()[0] ? nodes()[0].dept_cd : null);
  }
  // 권한·메뉴 검색이 걸려 있으면 그 결과 role 만 본다
  function roleFilterSet(rq){
    if(!rq) return null;
    return new Set(((ROLES && ROLES.roles) || []).map(r => r.role_id));
  }

  function render(ex){
    $("app").innerHTML = '<div class="layout"><div class="card" id="pTree"></div><div class="card" id="pDet"></div></div>';
    renderTree(ex); renderDetail(ex);
    if(BAR) BAR.applyPeriod();
  }

  /* ── 조직 트리 ── */
  function renderTree(ex){
    const all = shownNodes();
    const map = {}; all.forEach(n => map[n.dept_cd] = n);
    const kw = String(ex.q || '').trim().toLowerCase();

    /* 이번 렌더에서만 펼칠 노드 — OPEN 자체는 건드리지 않는다.
       검색어를 지우면 사용자가 접어 둔 모양이 그대로 돌아와야 한다. */
    const open = new Set(OPEN);
    const openPath = cd => {          // 조상들을 펼쳐 그 노드가 화면에 나오게 한다
      let p = (map[cd] || {}).par_dept_cd;
      while(p && map[p]){ open.add(p); p = map[p].par_dept_cd; }
    };
    if(SEL) openPath(SEL);                       // 고른 조직이 접혀서 사라지지 않게
    if(ex.child && SEL) open.add(SEL);           // 하위부서 포함 → 하위가 보여야 말이 된다
    if(kw) all.forEach(n => {                    // 검색에 걸린 부서는 경로째 펼친다
      if(String(n.dept_nm || '').toLowerCase().includes(kw)) openPath(n.dept_cd);
    });

    const visible = all.filter(n => {
      let p = n.par_dept_cd;
      while(p && map[p]){ if(!open.has(p)) return false; p = map[p].par_dept_cd; }
      return true;
    });
    const hitCnt = kw ? all.filter(n => String(n.dept_nm||'').toLowerCase().includes(kw)).length : 0;

    const rows = visible.map(n => {
      const kids = all.some(x => x.par_dept_cd === n.dept_cd);
      const tw = kids ? (open.has(n.dept_cd) ? '−' : '+') : '·';
      const lock = !n.visible;
      const hit = kw && String(n.dept_nm || '').toLowerCase().includes(kw);
      const hasMem = (n.member_cnt || 0) > 0 && !lock;
      let html = '<div class="tnode'+(n.dept_cd===SEL?' sel':'')+(lock?' locked':'')+(hit?' hit':'')+'"'
        + ' data-cd="'+esc(n.dept_cd)+'" data-kids="'+(kids?1:0)+'"'
        + ' title="'+esc(n.path_nm || n.dept_nm)+(lock?' — 열람 범위 밖':'')+'"'
        + ' style="padding-left:'+(9 + (n.lvl-1)*13)+'px">'
        +   '<span class="tw'+(kids?'':' leaf')+'"'+(kids?' title="하위 조직 펼치기·접기"':'')+'>'+tw+'</span>'
        +   '<span class="nm">'+esc(n.dept_nm)+(lock?' 🔒':'')+'</span>'
        +   '<span class="sp"></span>'
        +   (hasMem ? '<span class="mp" data-mem="'+esc(n.dept_cd)+'" title="인원 펼치기·접기">'
                      + (MEMOPEN.has(n.dept_cd) ? '−' : '+') + '</span>' : '')
        +   '<span class="cnt">'+((n.member_cnt||0) > 0 ? n.member_cnt
              : '<span style="opacity:.5">'+(n.member_cnt_desc||0)+'</span>')+'</span>'
        + '</div>';
      // 인원 펼침 — 선택된 부서의 구성원을 조직도 안에 바로 보여준다(팀장 먼저)
      if(MEMOPEN.has(n.dept_cd) && SEL === n.dept_cd && DETAIL && DETAIL.members){
        html += members().map(mm =>
          '<div class="tmem" data-em="'+esc(mm.email)+'" title="'+esc(mm.email)+' — 눌러서 권한 보기"'
          + ' style="padding-left:'+(9 + (n.lvl-1)*13 + 26)+'px">'
          + '<span class="nm">'+esc(mm.emp_nm || mm.email)+'</span>'
          + (mm.title ? '<span>'+esc(mm.title)+'</span>' : '')
          + '<span class="sp"></span><span>'+(mm.roles || []).length+'</span></div>').join('');
      }
      return html;
    }).join('');

    const un = TREE.unassigned_cnt || 0;
    $("pTree").innerHTML =
      '<h3>조직도 <span class="sm">'+num(nodes().reduce((s,n)=>s+(n.member_cnt||0),0))+'명</span></h3>'
      + (kw ? '<div class="tsearch">'
            + (hitCnt ? '「'+esc(kw)+'」 부서 <b>'+hitCnt+'곳</b> — 경로를 펼쳐 표시했습니다'
                      : '「'+esc(kw)+'」와 이름이 같은 부서는 없습니다 — 사람 이름이면 오른쪽 목록에서 찾습니다')
            + '</div>' : '')
      + '<div class="tree">' + (rows || '<div class="notice" style="margin:9px;border:none">표시할 조직이 없습니다.</div>')
      + (un > 0 && TREE.is_admin
          ? '<div class="tnode'+(SEL===UNASSIGNED?' sel':'')+'" data-cd="'+UNASSIGNED+'" data-kids="0"'
            + ' style="border-top:1px solid var(--line);padding:6px 9px"'
            + ' title="사내 조직에 속하지 않은 ERP 계정 — 외부 회계사·ERP 관리자 등. 조직도 밖이라 묻히기 쉬운 검토 대상입니다">'
            + '<span class="tw leaf">·</span><span class="nm">외부</span><span class="sp"></span>'
            + '<span class="cnt">'+un+'</span></div>'
          : '')
      + '</div>'
      + '<div class="tfootnote">인원이 없는 조직(원가부서·빈 법인)은 표시하지 않습니다 · 🔒 열람 범위 밖</div>';

    $("pTree").querySelectorAll('.tnode').forEach(el => {
      el.onclick = (e) => {
        const cd = el.dataset.cd, n = byCd(cd);
        if(el.dataset.kids === '1' && e.target.classList.contains('tw')){
          if(OPEN.has(cd)) OPEN.delete(cd); else OPEN.add(cd);
          return renderTree(BAR ? (BAR.value().extras || {}) : {});
        }
        if(e.target.classList.contains('mp')){
          if(MEMOPEN.has(cd)) MEMOPEN.delete(cd); else MEMOPEN.add(cd);
          if(SEL === cd) return renderTree(BAR ? (BAR.value().extras || {}) : {});
          SEL = cd; EXPANDED.clear();
          if(BAR) BAR.refresh();
          return;
        }
        if(!n || !n.visible) return;
        SEL = cd; EXPANDED.clear();
        if(BAR) BAR.refresh();
      };
    });
    $("pTree").querySelectorAll('.tmem').forEach(el =>
      el.onclick = (e) => { e.stopPropagation(); openPerson(el.dataset.em); });
  }

  /* ── 오른쪽 상세 ── */
  function renderDetail(ex){
    if(!SEL){ $("pDet").innerHTML = '<div class="pane"><div class="notice">왼쪽에서 조직을 선택하세요.</div></div>'; return; }
    if(DETAIL && DETAIL.forbidden){
      $("pDet").innerHTML = '<div class="pane"><div class="notice warn">이 조직을 열람할 권한이 없습니다. 관리자에게 부서 범위 권한을 요청하세요.</div></div>';
      return;
    }
    if(!DETAIL){ $("pDet").innerHTML = '<div class="pane"><div class="loading">불러오는 중…</div></div>'; return; }

    const d = DETAIL.dept || {}, m = members();

    const roleSet = new Set();
    m.forEach(mm => (mm.roles || []).forEach(r => roleSet.add(r.role_id)));
    const assign = m.reduce((s, mm) => s + (mm.roles || []).length, 0);

    $("pDet").innerHTML =
      '<h3>'+esc(SEL === UNASSIGNED ? '외부' : (d.dept_nm || SEL))
      +  '<span class="sm">'+esc(SEL === UNASSIGNED ? '사내 조직에 속하지 않은 ERP 계정(외부 회계사·관리자 계정)' : (d.path_nm || ''))
      +   (d.leader_nm ? ' · 부서장 '+esc(d.leader_nm) : '')
      +   (d.include_desc ? ' · 하위부서 포함' : '') + '</span></h3>'
      + '<div class="sum">'
      +   '<span class="si"><b>인원</b>'+num(m.length)+'명</span>'
      +   '<span class="si"><b>보유 권한</b>'+num(roleSet.size)+'종</span>'
      +   '<span class="si"><b>부여 건수</b>'+num(assign)+'</span>'
      +   '<span class="sp"></span>'
      +   '<span class="sr">Role 을 누르면 메뉴 권한이 열립니다</span>'
      + '</div>'
      + '<div class="tabs">'
      +   tabBtn('matrix','Matrix')
      +   tabBtn('member','구성원 '+m.length)
      +   tabBtn('role','권한별')
      +   tabBtn('clean','권한정리'+(PICK.size ? ' '+PICK.size : ''))
      + '</div><div class="pane" id="pane"></div>';

    $("pDet").querySelectorAll('.tab').forEach(t => t.onclick = () => { TAB = t.dataset.k; renderDetail(ex); });
    if(TAB === 'matrix') paneMatrix(ex);
    else if(TAB === 'role') paneRoleList(ex);
    else if(TAB === 'clean') paneClean(ex);
    else paneMembers(ex);
  }
  function tabBtn(k, lb){ return '<div class="tab'+(TAB===k?' on':'')+'" data-k="'+k+'">'+esc(lb)+'</div>'; }

  /* 구성원 — 팀장·부문장이 맨 앞. 이름·부서 검색과 권한/메뉴 검색이 함께 걸린다. */
  function members(){
    const ex = BAR ? (BAR.value().extras || {}) : {};
    const kw = String(ex.q || '').trim().toLowerCase();
    const rq = String(ex.rq || '').trim();
    const keep = roleFilterSet(rq);
    return (DETAIL.members || [])
      .map(mm => Object.assign({}, mm, {
        roles: (mm.roles || []).filter(r => !keep || keep.has(r.role_id)),
      }))
      .filter(mm => {
        if(keep && mm.roles.length === 0) return false;
        if(!kw) return true;
        return String(mm.emp_nm||'').toLowerCase().includes(kw)
            || String(mm.email||'').toLowerCase().includes(kw)
            || String(mm.dept_nm||'').toLowerCase().includes(kw);
      })
      .sort((a,b) => {
        const ra = LEAD.indexOf(a.title || ''), rb = LEAD.indexOf(b.title || '');
        const ka = ra < 0 ? 99 : ra, kb = rb < 0 ? 99 : rb;   // 대표 → 부문장 → 법인장 → 팀장 → 그 외
        return ka - kb
            || (b.roles.length - a.roles.length)
            || String(a.emp_nm||'').localeCompare(String(b.emp_nm||''), 'ko');
      });
  }

  function paneMembers(ex){
    const rows = members();
    let html = '<div class="tools"><button id="csv">CSV 내보내기</button>'
      + '<span class="legend">팀장·부문장이 맨 앞 · 행을 누르면 보유 권한, 권한을 누르면 메뉴가 열립니다</span></div>';
    if(!rows.length){ html += '<div class="notice">조건에 맞는 구성원이 없습니다.</div>'; $("pane").innerHTML = html; return; }

    html += '<table><thead><tr><th>이름</th><th>직책</th><th>부서</th><th class="c">보유 권한</th><th></th></tr></thead><tbody>';
    rows.forEach(mm => {
      const odd = [];
      if(!mm.gw_active) odd.push('GW없음');
      if(!mm.account_active) odd.push('ERP정지');
      const lead = LEAD.indexOf(mm.title || '') >= 0;
      html += '<tr class="click '+(lead?'lead':'')+'" data-em="'+esc(mm.email)+'">'
        + '<td>'+esc(mm.emp_nm || mm.email)
        +   (odd.length ? ' <span class="legend">'+esc(odd.join(' · '))+'</span>' : '')+'</td>'
        + '<td>'+esc(mm.title || '—')+'</td>'
        + '<td>'+esc(mm.dept_nm || '—')+'</td>'
        + '<td class="c">'+num(mm.roles.length)+'</td>'
        + '<td class="c">'+(EXPANDED.has(mm.email)?'▾':'▸')+'</td></tr>';
      if(EXPANDED.has(mm.email)){
        html += '<tr><td colspan="5" style="background:#fcfdfe">'+roleChips(mm.roles)+'</td></tr>';
      }
    });
    html += '</tbody></table>';
    $("pane").innerHTML = html;

    $("pane").querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
      const em = tr.dataset.em;
      if(EXPANDED.has(em)) EXPANDED.delete(em); else EXPANDED.add(em);
      paneMembers(ex);
    });
    $("pane").querySelectorAll('.chip[data-rid]').forEach(c =>
      c.onclick = (e) => { e.stopPropagation(); openRole(c.dataset.rid); });
    $("csv").onclick = () => exportMembers(rows);
  }

  function roleChips(roles){
    if(!roles.length) return '<span class="legend">표시할 권한이 없습니다.</span>';
    const g = {};
    roles.slice().sort((a,b) => String(a.role_nm).localeCompare(String(b.role_nm),'ko'))
      .forEach(r => { const k = r.module_label || r.module || '기타'; (g[k] = g[k] || []).push(r); });
    return Object.keys(g).sort().map(k =>
      '<div class="grp">'+esc(k)+'</div>'
      + g[k].map(r => '<span class="chip" data-rid="'+esc(r.role_id)+'" title="'+esc(r.role_id)+' — 눌러서 메뉴 권한 보기">'
          + esc(r.role_label || r.role_nm)
          + (r.is_write ? '<span class="w">쓰기</span>' : '')
          + '</span>').join('')
    ).join('');
  }

  /* Matrix — 행 = Role, 열 = 구성원. ROLE 칸을 누르면 메뉴 권한 팝업이 열린다. */
  /* 눈에 띄어야 할 권한 고르기 — 기준표 없이 **데이터가 스스로 말하는 것**만 쓴다.
     (부서 표준 세트는 2026-09-18 관리자 지시로 화면에서 뺐다. 여기서 되살리지 않는다.)

     두 가지만 본다
       · 이 부서에서 **몇 명이나 갖고 있나** — 서버가 준 peer_cnt/dept_size(회수분 제외, 자기 부서 기준)
         화면에서 세지 않는 이유: 「하위부서 포함」으로 보면 분모가 부문 전체가 돼
         팀 전원이 가진 권한도 소수처럼 보인다.
       · 그게 **쓰기 권한이거나 민감 모듈이거나, 이 부서가 거의 안 쓰는 모듈**인가

     표시는 「확인」 하나뿐이다(2026-09-21 관리자 지시 — 등급을 나누면 낮은 등급이 안전해 보인다).
     이건 **예상**이지 판정이 아니다. 기준표가 없으니 "다른 사람과 다르다"까지만 말할 수 있고,
     진짜 타부서 권한인데 부서원 다수가 함께 갖고 있으면 여기 뜨지 않는다.
     인원이 적은 조직(3명 미만)은 무엇이든 소수라서 판정하지 않는다. */
  function flagRoles(mem, roles){
    // 이 부서가 실제로 쓰는 모듈 — 구성원 중 몇 %가 그 모듈 권한을 갖는가
    const modUse = {}, N = mem.length;
    mem.forEach(mm => {
      const seen = {};
      (mm.roles || []).forEach(r => { seen[r.module_label || r.module || '기타'] = true; });
      Object.keys(seen).forEach(k => { modUse[k] = (modUse[k] || 0) + 1; });
    });

    const out = {};
    roles.forEach(({ r, holders }) => {
      const hs = Object.keys(holders);
      // 보유자들이 각자 자기 부서에서 차지하는 비율 중 가장 큰 값
      let best = null, cnt = null, size = null;
      hs.forEach(em => {
        const mm = mem.find(x => x.email === em);
        const rr = mm && (mm.roles || []).find(x => x.role_id === r.role_id);
        if(!rr || !rr.dept_size || rr.dept_size < 3) return;
        const ratio = (rr.peer_ratio != null) ? Number(rr.peer_ratio) : (rr.peer_cnt / rr.dept_size);
        if(best === null || ratio > best){ best = ratio; cnt = rr.peer_cnt; size = rr.dept_size; }
      });
      if(best === null || best > 0.34) return;          // 부서에서 흔한 권한 → 표시 안 함

      const grp = r.module_label || r.module || '기타';
      const rare = N >= 4 && (modUse[grp] || 0) / N < 0.25;   // 이 부서가 거의 안 쓰는 모듈
      const hard = !!r.is_write || !!r.sensitive || rare;
      // 작은 팀(6명 미만)에서 「몇 명만 보유」는 당연해서 신호가 되지 못한다.
      // 쓰기·민감·타 모듈처럼 내용 자체가 눈에 띄는 것만 남기고 조회성은 표시하지 않는다.
      if(!hard && size < 6) return;
      const who = (cnt === 1) ? '이 부서에서 한 명만' : ('이 부서 ' + size + '명 중 ' + cnt + '명만');
      const why = [
        who + ' 보유',
        r.is_write ? '쓰기 권한' : null,
        r.sensitive ? '민감 모듈' : null,
        rare ? '이 부서가 거의 안 쓰는 모듈(' + grp + ')' : null,
      ].filter(Boolean).join(' · ');

      out[r.role_id] = {
        lv: 1,                      // 등급을 나누지 않는다 — 전부 「확인」
        tag: '확인',
        why: why + ' — 소수 권한 또는 타부서 권한으로 예상됩니다. 업무상 필요한지 확인해 주세요',
        hs: holders,
      };
    });
    return out;
  }

  /* 매트릭스 위 안내 — 「여기 없으면 안전하다」로 읽히지 않게 쓴다.
     부서원 다수가 함께 가진 타부서 권한은 이 표시에 걸리지 않기 때문이다. */
  const FLNOTE = '(다수가 함께 가진 타부서 권한은 표시되지 않습니다 — 전체를 함께 확인)';
  function flagHint(fl){
    const n = Object.keys(fl).length;
    return '<div class="mx__hint"><span>'
      + (n ? '<i class="k f1"></i><b>확인 '+n+'건</b> — 소수 권한 또는 타부서 권한으로 예상되는 권한입니다'
           : '<b>눈에 띄는 권한 없음</b> — 모든 권한을 부서원 다수가 함께 갖고 있습니다')
      + ' <span class="mx__note">'+FLNOTE+'</span></span></div>';
  }

  function paneMatrix(ex){
    const mem = members();
    const map = {};
    mem.forEach(mm => (mm.roles || []).forEach(r => {
      if(!map[r.role_id]) map[r.role_id] = { r, holders:{} };
      map[r.role_id].holders[mm.email] = true;
    }));
    const roles = Object.values(map).sort((a,b) =>
      String(a.r.module_label||'').localeCompare(String(b.r.module_label||''),'ko')
      || String(a.r.role_nm).localeCompare(String(b.r.role_nm),'ko'));
    if(!mem.length || !roles.length){ $("pane").innerHTML = '<div class="notice">표시할 데이터가 없습니다.</div>'; return; }

    const FL = flagRoles(mem, roles);
    const multiDept = new Set(mem.map(mm => mm.dept_nm || '')).size > 1;
    let prev = null;
    let html = '<div class="tools"><button id="csvm">CSV 내보내기</button>'
      + '<span class="legend">행 = Role · 열 = 구성원 · ROLE 칸을 누르면 메뉴 권한이 열립니다</span></div>'
      + flagHint(FL)
      + '<div class="mx__wrap"><table><thead><tr>'
      + '<th class="mx__fix">ROLE</th><th class="mx__n">보유</th>'
      + mem.map(mm => '<th class="mx__n" title="'+esc(mm.email)+'">'+esc(mm.emp_nm || mm.email)
          + (multiDept ? '<span class="mx__dp">'+esc(mm.dept_nm || '')+'</span>' : '')+'</th>').join('')
      + '</tr></thead><tbody>';
    roles.forEach(({ r, holders }) => {
      const grp = r.module_label || r.module || '기타';
      const gap = (prev !== null && grp !== prev) ? ' class="mx__gap"' : '';
      prev = grp;
      const f = FL[r.role_id];
      const fc = f ? ' f'+f.lv : '';
      const hc = f ? ' h'+f.lv : '';
      html += '<tr'+gap+'><td class="mx__fix'+fc+'" data-rid="'+esc(r.role_id)+'" title="'
        + esc(f ? f.why : (r.role_id + ' — 눌러서 메뉴 권한 보기'))+'">'
        + '<span class="legend">'+esc(grp)+'</span><br>'+esc(r.role_label || r.role_nm)
        + (f ? '<span class="mx__tag f'+f.lv+'">'+f.tag+'</span>' : '')+'</td>'
        + '<td class="mx__n">'+Object.keys(holders).length+'</td>'
        + mem.map(mm => '<td class="mx__n '+(holders[mm.email]?'mx__o'+hc:'mx__m')+'">'
            + (holders[mm.email] ? 'O' : '·') + '</td>').join('')
        + '</tr>';
    });
    html += '</tbody><tfoot><tr><td class="mx__fix">구성원별 합계</td><td class="mx__n">—</td>'
      + mem.map(mm => '<td class="mx__n">'+(mm.roles||[]).length+'</td>').join('')
      + '</tr></tfoot></table></div>';
    $("pane").innerHTML = html;
    $("pane").querySelectorAll('td.mx__fix[data-rid]').forEach(td => td.onclick = () => openRole(td.dataset.rid));
    $("csvm").onclick = () => exportMatrix(mem, roles);
  }

  /* 권한별 — 기본은 전사, 「선택 조직만」 을 켜면 고른 부서 보유분으로 좁힌다. */
  function paneRoleList(ex){
    const all = (ROLES && ROLES.roles) || [];
    let list = all.slice();
    if(ROLEDEPT){
      const own = new Set();
      members().forEach(mm => (mm.roles || []).forEach(r => own.add(r.role_id)));
      list = list.filter(r => own.has(r.role_id));
    }
    const mods = {};
    all.forEach(r => { const k = r.module_label || r.module || '기타'; mods[k] = (mods[k] || 0) + 1; });
    if(ROLEMOD !== 'all') list = list.filter(r => (r.module_label || r.module || '기타') === ROLEMOD);
    list.sort((a,b) => (b.user_cnt - a.user_cnt) || String(a.role_nm).localeCompare(String(b.role_nm),'ko'));

    let html = '<div class="tools">'
      + '<button class="'+(ROLEMOD==='all'?'on':'')+'" data-mod="all">전체 '+all.length+'</button>'
      + Object.keys(mods).sort().map(k => '<button class="'+(ROLEMOD===k?'on':'')+'" data-mod="'+esc(k)+'">'+esc(k)+' '+mods[k]+'</button>').join('')
      + '<span style="flex:1 1 auto"></span>'
      + '<span class="legend">이 조직이 보유한 권한만 · 전사는 상단 「전체 권한 조회」</span>'
      + '<button id="csvr">CSV 내보내기</button></div>';

    if(!list.length){
      html += '<div class="notice">조건에 맞는 권한이 없습니다.</div>';
      $("pane").innerHTML = html; bindRoleTools(ex, list); return;
    }

    html += '<table><thead><tr><th>ROLE ID</th><th>ROLE명</th><th class="c">사용자</th><th class="c">메뉴</th></tr></thead><tbody>'
      + list.map(r => '<tr class="click" data-rid="'+esc(r.role_id)+'">'
          + '<td><code>'+esc(r.role_id)+'</code></td>'
          + '<td>'+esc(r.role_nm)+(r.sensitive?' <span class="legend">민감</span>':'')+'</td>'
          + '<td class="c">'+num(r.user_cnt)+'</td>'
          + '<td class="c">'+num(r.menu_cnt)+'</td></tr>').join('')
      + '</tbody></table>';
    $("pane").innerHTML = html;
    $("pane").querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openRole(tr.dataset.rid));
    bindRoleTools(ex, list);
  }
  function bindRoleTools(ex, list){
    $("pane").querySelectorAll('button[data-mod]').forEach(b =>
      b.onclick = () => { ROLEMOD = b.dataset.mod; paneRoleList(ex); });
    const x = $("csvr"); if(x) x.onclick = () => exportRoleList(list || []);
  }

  /* ── Role 상세 팝업 — 메뉴 권한 트리 + 보유자 ── */
  /* ── 전체 권한 조회 ──────────────────────────────────────────────────
     조직을 고르지 않고 ERP 권한(Role) 전체를 훑는 창. 참조 자료
     「ERP전체권한현황」의 쓰임새(권한 목록 ↔ 메뉴 트리)를 그대로 가져왔다.
     · 왼쪽: Role 목록 — 모듈 묶음 단추 + Role명 검색 + **메뉴명 검색**(서버)
     · 오른쪽: 고른 Role 의 메뉴 권한 트리 + 보유자
     메뉴명 검색을 여기에 둔 이유: 조회조건에 있으면 부서를 고를 때마다 서버를
     다시 때리는데, 메뉴는 조직과 무관한 마스터라 그럴 이유가 없다. */
  let CAT = { q:'', mq:'', mod:'all', rid:null, roles:null, busy:false, t:null };

  async function openCatalog(){
    $("modal").innerHTML =
      '<div class="ov"><div class="mo wide"><header>'
      + '<div><h4>📖 전체 권한 조회</h4>'
      +   '<div class="legend">조직과 상관없이 ERP 권한(Role)과 그 메뉴를 봅니다 · '
      +   'Role 을 고르면 오른쪽에 메뉴 권한과 보유자가 열립니다</div></div>'
      + '<button class="x" id="mx">×</button></header>'
      + '<div class="body"><div class="rc__wrap">'
      +   '<div><div class="rc__bar">'
      +     '<input type="text" id="rcQ" placeholder="Role명 · ID" style="width:150px" value="'+esc(CAT.q)+'">'
      +     '<input type="text" id="rcM" placeholder="메뉴명으로 찾기" style="width:170px" value="'+esc(CAT.mq)+'">'
      +     '<span class="legend" id="rcN"></span></div>'
      +     '<div class="rc__gt" id="rcG"></div>'
      +     '<div class="rc__list" id="rcL"><div class="loading">불러오는 중…</div></div></div>'
      +   '<div class="rc__det" id="rcD"><div class="notice">왼쪽에서 권한을 고르세요.</div></div>'
      + '</div></div></div></div>';
    bindModalClose();
    const q = $("rcQ"), m = $("rcM");
    const kick = () => { clearTimeout(CAT.t); CAT.t = setTimeout(() => {
      CAT.q = q.value; CAT.mq = m.value; loadCatalog(); }, 350); };
    q.oninput = kick; m.oninput = kick;
    q.focus();
    await loadCatalog();
  }

  async function loadCatalog(){
    if(CAT.busy) return;
    CAT.busy = true;
    if($("rcL")) $("rcL").innerHTML = '<div class="loading">불러오는 중…</div>';
    let r;
    // finally 로 푸는 이유: 한 번이라도 던지면 busy 가 켜진 채 남아
    // 이후 모든 조회가 조용히 무시된다(「불러오는 중…」에서 멈춘 채로).
    try { r = await erpApi.erpRoleList({ q: CAT.q.trim() || null, menuQ: CAT.mq.trim() || null }); }
    finally { CAT.busy = false; }
    if(!$("rcL")) return;                       // 그 사이 닫혔으면 그만둔다
    if(!r || !r.ok){
      $("rcL").innerHTML = '<div class="notice warn">'
        + (r && r.forbidden ? '권한 목록을 볼 수 없습니다.' : '목록을 불러오지 못했습니다.')+'</div>';
      return;
    }
    CAT.roles = r.roles || [];
    renderCatalog();
  }

  function renderCatalog(){
    const all = CAT.roles || [];
    const mods = {};
    all.forEach(r => { const k = r.module_label || r.module || '기타'; mods[k] = (mods[k]||0)+1; });
    if(CAT.mod !== 'all' && !mods[CAT.mod]) CAT.mod = 'all';
    const list = (CAT.mod === 'all' ? all
                  : all.filter(r => (r.module_label || r.module || '기타') === CAT.mod))
                 .slice().sort((a,b) => String(a.role_nm).localeCompare(String(b.role_nm),'ko'));

    $("rcN").textContent = CAT.mq.trim()
      ? '메뉴 「'+CAT.mq.trim()+'」 를 가진 권한 '+all.length+'종'
      : '권한 '+all.length+'종';
    $("rcG").innerHTML = '<button class="'+(CAT.mod==='all'?'on':'')+'" data-m="all">전체 '+all.length+'</button>'
      + Object.keys(mods).sort().map(k =>
          '<button class="'+(CAT.mod===k?'on':'')+'" data-m="'+esc(k)+'">'+esc(k)+' '+mods[k]+'</button>').join('');
    $("rcG").querySelectorAll('button').forEach(b =>
      b.onclick = () => { CAT.mod = b.dataset.m; renderCatalog(); });

    $("rcL").innerHTML = list.length
      ? list.map(r => '<div class="it'+(CAT.rid===r.role_id?' on':'')+'" data-rid="'+esc(r.role_id)+'">'
          + '<span class="nm">'+esc(r.role_nm)
          +   (r.sensitive ? ' <span class="legend">민감</span>' : '')
          +   '<br><code class="legend">'+esc(r.role_id)+'</code></span>'
          + '<span class="n">메뉴 '+num(r.menu_cnt)+' · 사용자 '+num(r.user_cnt)+'</span></div>').join('')
      : '<div class="notice">조건에 맞는 권한이 없습니다.</div>';
    $("rcL").querySelectorAll('.it').forEach(el =>
      el.onclick = () => { CAT.rid = el.dataset.rid; renderCatalog(); loadCatalogDetail(); });

    if(CAT.rid && list.some(r => r.role_id === CAT.rid)) loadCatalogDetail();
  }

  async function loadCatalogDetail(){
    const rid = CAT.rid;
    if(!rid || !$("rcD")) return;
    let d = RCACHE.get(rid);
    if(!d){
      $("rcD").innerHTML = '<div class="loading">메뉴 권한을 불러오는 중…</div>';
      d = await erpApi.erpRoleMenuDetail(rid);
      if(d && d.ok) RCACHE.set(rid, d);
    }
    if(!$("rcD") || CAT.rid !== rid) return;
    if(!d || !d.ok){
      $("rcD").innerHTML = '<div class="notice warn">상세를 불러오지 못했습니다.</div>';
      return;
    }
    const role = d.role || {}, menus = d.menus || [], holders = d.holders || [];
    const mq = CAT.mq.trim().toLowerCase();
    const shown = mq ? menus.filter(mn => String(mn.mnu_nm||'').toLowerCase().includes(mq)
                                       || String(mn.mnu_id||'').toLowerCase().includes(mq)) : menus;
    const byDept = {};
    holders.forEach(h => { const k = h.dept_nm || '외부'; (byDept[k] = byDept[k] || []).push(h); });

    $("rcD").innerHTML =
      '<div class="grp">'+esc(role.role_nm || rid)
      + ' <span class="legend"><code>'+esc(rid)+'</code>'
      + (role.module_label ? ' · '+esc(role.module_label) : '')+'</span></div>'
      + '<div class="grp">메뉴 권한 '+num(d.menu_cnt)
      +   (mq ? ' <span class="legend">— 「'+esc(CAT.mq.trim())+'」 일치 '+num(shown.length)+'건만 표시</span>' : '')
      + '</div>'
      + (shown.length ? '<div class="mtree" style="max-height:38vh">'+shown.map(menuRow).join('')+'</div>'
                      : '<div class="notice">표시할 메뉴가 없습니다.</div>')
      + '<div class="grp">보유자 '+num(holders.length)+'명</div>'
      + (holders.length
          ? Object.keys(byDept).sort().map(k => '<div class="grp">'+esc(k)+' '+byDept[k].length+'</div>'
              + byDept[k].map(h => '<span class="chip flat">'+esc(h.emp_nm || h.email)
                  + (h.title ? '<span class="w">'+esc(h.title)+'</span>' : '')+'</span>').join('')).join('')
          : '<div class="notice">보유자가 없습니다(열람 범위 안 기준).</div>');
  }

  /* 메뉴 한 줄 — 이름이 코드로만 오는 경우를 숨기지 않고 있는 그대로 알린다.
     name_src: exact(마스터 정확일치) / variant(법인 변형 접미사를 뗀 기본 코드의 이름) / code(이름 없음) */
  function menuRow(mn){
    const src = mn.name_src || 'exact';
    const nm = src === 'code'
      ? '<span class="cd">'+esc(mn.mnu_nm)+'</span> <span class="vr">메뉴명 미등록</span>'
      : esc(mn.mnu_nm) + (src === 'variant'
          ? '<span class="vr" title="법인 변형 코드 '+esc(mn.mnu_id||'')+' — 기본 메뉴의 이름을 씁니다">'
            + esc(mn.variant_cd || '변형')+'</span>' : '');
    return '<div class="mrow" style="padding-left:'+(9 + Math.min(mn.depth||0, 8)*13)+'px"'
      + ' title="'+esc((mn.path_nm||'') + ' · ' + (mn.mnu_id||''))+'">'
      + '<span class="mn">'+nm+'</span><span class="sp"></span>'
      + '<span class="act '+esc(mn.action_id||'')+'">'+esc(mn.action_nm||'')+'</span></div>';
  }

  async function openRole(roleId){
    if(!roleId) return;
    $("modal").innerHTML = '<div class="ov"><div class="mo"><header><h4>'+esc(roleId)+'</h4>'
      + '<button class="x" id="mx">×</button></header><div class="body"><div class="loading">메뉴 권한을 불러오는 중…</div></div></div></div>';
    bindModalClose();
    let d = RCACHE.get(roleId);
    if(!d){
      d = await erpApi.erpRoleMenuDetail(roleId);
      if(d && d.ok) RCACHE.set(roleId, d);
    }
    if(!$("modal").querySelector('.mo')) return;   // 불러오는 사이 닫혔으면 그만둔다
    if(!d || !d.ok){
      $("modal").querySelector('.body').innerHTML =
        '<div class="notice warn">'+(d && d.forbidden ? '이 권한의 상세를 볼 수 없습니다.' : '상세를 불러오지 못했습니다.')+'</div>';
      return;
    }
    const role = d.role || {}, menus = d.menus || [], holders = d.holders || [];
    const byDept = {};
    holders.forEach(h => { const k = h.dept_nm || '외부'; (byDept[k] = byDept[k] || []).push(h); });

    $("modal").querySelector('header').innerHTML =
      '<div><h4>'+esc(role.role_nm || roleId)+'</h4>'
      + '<div class="legend"><code>'+esc(roleId)+'</code>'+(role.module_label ? ' · '+esc(role.module_label) : '')+'</div></div>'
      + '<button class="x" id="mx">×</button>';
    $("modal").querySelector('.body').innerHTML =
      '<div class="cols">'
      + '<div><div class="grp">메뉴 권한 '+num(d.menu_cnt)+'건</div>'
      +   (menus.length
            ? '<div class="mtree">' + menus.map(mn =>
                menuRow(mn)).join('')
              + '</div>'
            : '<div class="notice">이 권한에 연결된 메뉴가 없습니다.</div>')
      + '</div>'
      + '<div><div class="grp">사용자 '+num(holders.length)+'명</div>'
      +   (holders.length
            ? Object.keys(byDept).sort().map(k =>
                '<div class="grp">'+esc(k)+' '+byDept[k].length+'</div>'
                + byDept[k].map(h => '<span class="chip" data-pem="'+esc(h.email)+'" title="'+esc(h.email)+' — 눌러서 이 사람의 권한 보기">'
                    + esc(h.emp_nm || h.email)
                    + (h.title ? '<span class="w">'+esc(h.title)+'</span>' : '')+'</span>').join('')).join('')
            : '<div class="notice">보유자가 없습니다(열람 범위 안 기준).</div>')
      + '</div></div>';
    $("modal").querySelectorAll('.chip[data-pem]').forEach(c =>
      c.onclick = () => openPerson(c.dataset.pem));
    bindModalClose();
  }
  /* 권한정리 — 팀장·부서장이 「이 권한은 빼자」를 표시해 장부에 남긴다.
     ERP 에서 실제로 회수하지는 않는다(CLAUDE.md §1.6 — 실거래 액션은 사람이 실행).
     저장자 이름은 서버가 붙인다. 확인 문구를 정확히 입력해야 저장된다. */
  const CLTEXT = '권한확인 완료';
  const pkey = (em, rid) => em + '|' + rid;

  /* 한국시간으로 찍는다 — timestamptz 를 문자열로 잘라 쓰면 UTC 가 그대로 보인다(9시간 어긋남) */
  function kst(v){
    if(!v) return '';
    const d = new Date(v);
    if(isNaN(d.getTime())) return String(v).slice(0, 16).replace('T', ' ');
    const p = new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit',
      day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' })
      .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
    return p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute;
  }

  /* 권한정리 — 팀장·부서장이 「이 권한은 빼자」를 표시해 장부에 남긴다.
     ERP 에서 실제로 회수하지는 않는다(CLAUDE.md §1.6 — 실거래 액션은 사람이 실행).

     화면 규칙(2026-09-21 관리자 지시로 단순화)
       · 체크 → 「권한확인 완료」 입력 → 저장. **담기·비우기 단계를 없앴다.**
       · 이미 올린 권한은 ROLE 행에서 **「정리완료」** 로만 알리고, 상태·요청자 표는 두지 않는다.
       · 물리는 것도 ROLE 행의 **「삭제」** 하나로 한다(장부에는 '취소'로 남는다 — 감사 기록은 지우지 않는다).
       · 시각은 전부 한국시간. */
  function paneClean(ex){
    // 이 부서의 정리 내역을 먼저 읽어 둔다 — 이미 올린 권한을 눌러 두려면 필요하다.
    if(CLLOG === null && !CLBUSY){
      CLBUSY = true;
      erpApi.erpRoleCleanupList({ deptCd: SEL })
        .then(r => { CLLOG = (r && r.ok) ? r : { rows: [] }; })
        .catch(() => { CLLOG = { rows: [] }; })
        .finally(() => { CLBUSY = false; if(TAB === 'clean') renderDetail(ex); });
    }
    const done = {};      // role_id → 살아 있는(미처리) 제외 요청
    ((CLLOG && CLLOG.rows) || []).forEach(r => {
      if(r.status === 'requested') (done[r.role_id] = done[r.role_id] || []).push(r);
    });
    const liveCnt = Object.values(done).reduce((n, a) => n + a.length, 0);

    const mem = members();
    const map = {};
    mem.forEach(mm => (mm.roles || []).forEach(r => {
      if(!map[r.role_id]) map[r.role_id] = { r, holders:{} };
      map[r.role_id].holders[mm.email] = true;
    }));
    const roles = Object.values(map).sort((a,b) =>
      String(a.r.module_label||'').localeCompare(String(b.r.module_label||''),'ko')
      || String(a.r.role_nm).localeCompare(String(b.r.role_nm),'ko'));

    const CF = (CLLOG && CLLOG.confirm) || null;   // 확인완료 → 「수정」 전까지 잠금
    const canSave = !CF && CLCONFIRM.trim() === CLTEXT;
    let html = '';

    if(CF){
      // ⚠ 저장 묶음의 건수(exclude_cnt)가 아니라 **지금 살아 있는 요청 수**를 센다.
      //   수정 후 다시 저장하면 새 묶음은 0건이라, 묶음 건수를 쓰면 요청이 남아 있는데도
      //   「변경없음」이라고 말한다(2026-09-21 관리자 지적).
      html += '<div class="cl__cf"><span class="ic">\u2705</span>'
        + '<div><b>권한확인 완료</b> \u2014 '+esc(CF.by || '')+' · '+esc(kst(CF.at))
        +   ' · '+(liveCnt ? '제외 '+num(liveCnt)+'건' : '변경없음')
        + '</div><span class="sp"></span>'
        + '<button id="clEdit">수정</button></div>';
    }

    if(CLDONE){
      html += '<div class="cl__ok">권한확인 완료로 저장했습니다 \u2014 '
        + (CLDONE.saved ? '<b>제외 '+num(CLDONE.saved)+'건</b>' : '<b>변경없음</b>')
        + (CLDONE.skipped ? ' · 건너뜀 '+num(CLDONE.skipped)+'건(이미 등록됐거나 대상이 아님)' : '')
        + ' · 저장자 <b>'+esc(CLDONE.by||'')+'</b></div>';
    }

    html += '<div class="cl__bar'+(CF ? ' cl__lock' : '')+'">'
      + '<span class="legend">체크한 권한 <b>'+PICK.size+'</b>건</span>'
      + '<span style="flex:1 1 auto"></span>'
      + '<input type="text" id="clNote" placeholder="메모(선택)" style="width:170px" value="'+esc(CLNOTE)+'">'
      + '<input type="text" id="clOk" placeholder="'+CLTEXT+'" style="width:150px" value="'+esc(CLCONFIRM)+'">'
      + '<button class="go" id="clSave"'+(canSave?'':' disabled')+'>'
      +   (PICK.size ? '저장 ('+PICK.size+'건 제외)' : '저장 (변경없음)')+'</button>'
      + '<a class="cl__help" href="/docs/erp/role-cleanup" target="_blank" rel="noopener"'
      +   ' title="캡처 2장으로 보는 사용 안내">📄 사용 안내</a></div>';

    if(!mem.length || !roles.length){
      html += '<div class="notice">표시할 데이터가 없습니다.</div>';
      $("pane").innerHTML = html; bindClean(ex); return;
    }

    const FL = flagRoles(mem, roles);
    const multiDept = new Set(mem.map(mm => mm.dept_nm || '')).size > 1;
    html += '<div class="legend" style="margin-bottom:6px">'
      + '뺄 권한을 <b>체크</b>하고 확인 문구 <b>'+CLTEXT+'</b> 를 입력한 뒤 저장합니다 '
      + '\u00b7 ROLE 이름을 누르면 그 줄 전원이 선택\u00b7해제됩니다 '
      + '\u00b7 뺄 것이 없으면 체크 없이 저장하면 <b>변경없음</b>으로 기록됩니다</div>'
      + flagHint(FL)
      + '<div class="mx__wrap"><table><thead><tr>'
      + '<th class="mx__fix">ROLE</th><th class="mx__n">보유</th>'
      + mem.map(mm => '<th class="mx__n" title="'+esc(mm.email)+'">'+esc(mm.emp_nm || mm.email)
          + (multiDept ? '<span class="mx__dp">'+esc(mm.dept_nm || '')+'</span>' : '')+'</th>').join('')
      + '</tr></thead><tbody>';
    roles.forEach(({ r, holders }) => {
      const f  = FL[r.role_id];
      const dn = done[r.role_id];                       // 살아 있는 제외 요청
      const byEm = {};
      (dn || []).forEach(x => { byEm[String(x.email || '').toLowerCase()] = x; });
      const mineIds = (dn || []).filter(x => x.mine).map(x => x.id);
      html += '<tr'+(dn ? ' class="cl__done"' : '')+'>'
        + '<td class="mx__fix'+(f && !dn ? ' f'+f.lv : '')+'" data-rowsel="'+esc(r.role_id)+'" title="'
        + esc(dn ? '정리 요청을 올린 권한입니다' : (f ? f.why + ' / 눌러서 전원 선택·해제' : '전원 선택·해제'))+'">'
        + '<span class="legend">'+esc(r.module_label || r.module || '기타')+'</span><br>'
        + esc(r.role_label || r.role_nm)
        + (f ? '<span class="mx__tag f'+f.lv+'">'+f.tag+'</span>' : '')
        + (dn ? '<span class="cl__dn">정리완료</span>' : '')
        // 삭제는 「수정」으로 잠금을 푼 뒤에만. 내가 올린 건만 지워진다(판정은 서버가 다시 한다).
        + (dn && !CF && mineIds.length
            ? '<button class="cl__x" data-cx="'+esc(mineIds.join(','))+'" title="이 권한의 정리 요청을 지웁니다">삭제</button>' : '')
        + '</td>'
        + '<td class="mx__n">'+Object.keys(holders).length+'</td>'
        + mem.map(mm => {
            if(!holders[mm.email]) return '<td class="mx__n mx__m">\u00b7</td>';
            const hit = byEm[String(mm.email).toLowerCase()];
            // 이미 올린 대상은 다시 담지 못하게 잠근다(서버도 중복을 막지만 화면에서 먼저 알린다)
            if(hit) return '<td class="mx__n" title="'+esc((hit.requested_by_nm||'')+' · '+kst(hit.requested_at))+'">\u2713</td>';
            return '<td class="mx__n"><input type="checkbox" data-em="'+esc(mm.email)+'" data-rid="'+esc(r.role_id)+'"'
              + (PICK.has(pkey(mm.email, r.role_id)) ? ' checked' : '')+'></td>';
          }).join('')
        + '</tr>';
    });
    html += '</tbody></table></div>';
    $("pane").innerHTML = html;
    bindClean(ex, mem, roles);
  }

  function bindClean(ex, mem, roles){
    const note = $("clNote"), ok = $("clOk");
    if(note) note.oninput = () => { CLNOTE = note.value; };
    if(ok) ok.oninput = () => {
      CLCONFIRM = ok.value;
      const b = $("clSave");
      if(b) b.disabled = !!(CLLOG && CLLOG.confirm) || CLCONFIRM.trim() !== CLTEXT;
    };

    /* 체크 자체가 선택이다 — 「담기」 단계를 없앴다(2026-09-21).
       다만 화면이 다시 그려져도 체크가 날아가지 않도록 PICK 에 그대로 옮겨 둔다. */
    const sync = (c) => {
      const em = c.dataset.em, rid = c.dataset.rid, k = pkey(em, rid);
      if(c.checked){
        const mm = (mem || []).find(x => x.email === em);
        const rr = (roles || []).find(x => x.r.role_id === rid);
        PICK.set(k, { email: em, role_id: rid,
          emp_nm: (mm && mm.emp_nm) || em, role_nm: (rr && rr.r.role_nm) || rid });
      }else PICK.delete(k);
    };
    const paintCnt = () => {
      const el = $("pane").querySelector('.cl__bar .legend b'); if(el) el.textContent = PICK.size;
      const b = $("clSave");
      if(b) b.textContent = PICK.size ? '저장 ('+PICK.size+'건 제외)' : '저장 (변경없음)';
    };
    $("pane").querySelectorAll('input[type=checkbox][data-em]').forEach(c =>
      c.onchange = () => { sync(c); CLDONE = null; paintCnt(); });

    $("pane").querySelectorAll('td[data-rowsel]').forEach(td => td.onclick = (e) => {
      if(e.target.classList.contains('cl__x')) return;      // 삭제 버튼은 따로 논다
      const rid = td.dataset.rowsel;
      const boxes = [...$("pane").querySelectorAll('input[data-rid="'+rid+'"]')];
      if(!boxes.length) return;
      const allOn = boxes.every(b => b.checked);
      boxes.forEach(b => { b.checked = !allOn; sync(b); });
      CLDONE = null; paintCnt();
    });

    const ed = $("clEdit");
    if(ed) ed.onclick = async () => {
      ed.disabled = true;
      const r = await erpApi.erpRoleCleanupReopen(SEL);
      if(r && r.ok){
        const l = await erpApi.erpRoleCleanupList({ deptCd: SEL });
        CLLOG = (l && l.ok) ? l : { rows: [] };
        CLDONE = null;
      }else{
        alert(r && r.message ? r.message : '수정 상태로 바꾸지 못했습니다.');
        ed.disabled = false;
      }
      renderDetail(ex);
    };

    // ROLE 행의 「삭제」 — 그 권한에 대해 내가 올린 요청을 한 번에 물린다
    $("pane").querySelectorAll('[data-cx]').forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      b.disabled = true;
      const ids = String(b.dataset.cx).split(',').map(Number).filter(Boolean);
      const r = await erpApi.erpRoleCleanupCancel(ids);
      if(r && r.ok && r.cancelled > 0){
        const l = await erpApi.erpRoleCleanupList({ deptCd: SEL });
        CLLOG = (l && l.ok) ? l : { rows: [] };
        CLDONE = null;
      }else{
        alert(r && r.message ? r.message : '지우지 못했습니다 — 본인이 올린 미처리 건만 지울 수 있습니다.');
        b.disabled = false;
      }
      renderDetail(ex);
    });

    const save = $("clSave");
    if(save) save.onclick = async () => {
      save.disabled = true;
      // 제외 0건이어도 보낸다 — 서버가 「변경없음」으로 기록한다
      const r = await erpApi.erpRoleCleanupSave(SEL, [...PICK.values()].map(v =>
        ({ email: v.email, role_id: v.role_id })), CLCONFIRM, CLNOTE || null);
      if(r && r.ok){
        CLDONE = r; PICK.clear(); CLCONFIRM = ''; CLNOTE = '';
        const l = await erpApi.erpRoleCleanupList({ deptCd: SEL });
        CLLOG = (l && l.ok) ? l : null;
      }else{
        alert(r && r.message ? r.message
              : (r && r.forbidden ? '이 조직의 권한을 정리할 권한이 없습니다.' : '저장하지 못했습니다.'));
      }
      renderDetail(ex);
    };
  }

  /* 사람 한 명의 ERP 권한 — 권한별 탭의 보유자·조직도 인원에서 연다 */
  const PCACHE = new Map();
  async function openPerson(email){
    if(!email) return;
    $("modal").innerHTML = '<div class="ov"><div class="mo"><header><h4>'+esc(email)+'</h4>'
      + '<button class="x" id="mx">×</button></header><div class="body"><div class="loading">권한을 불러오는 중…</div></div></div></div>';
    bindModalClose();
    let d = PCACHE.get(email);
    if(!d){ d = await erpApi.erpUserRoles(email); if(d && d.ok) PCACHE.set(email, d); }
    if(!$("modal").querySelector('.mo')) return;
    if(!d || !d.ok){
      $("modal").querySelector('.body').innerHTML =
        '<div class="notice warn">'+(d && d.forbidden ? '이 사용자를 열람할 권한이 없습니다.' : '권한을 불러오지 못했습니다.')+'</div>';
      return;
    }
    const u = d.user || {}, roles = d.roles || [];
    const g = {};
    roles.forEach(r => { const k = r.module_label || r.module || '기타'; (g[k] = g[k] || []).push(r); });
    $("modal").querySelector('header').innerHTML =
      '<div><h4>'+esc(u.emp_nm || email)+(u.title ? ' <span class="legend">'+esc(u.title)+'</span>' : '')+'</h4>'
      + '<div class="legend">'+esc(u.dept_nm || '외부')+(u.external ? ' · 외부' : '')
      +   ' · <code>'+esc(email)+'</code>'
      +   (u.account_active ? '' : ' · ERP정지')+(u.gw_active ? '' : ' · GW없음')+'</div></div>'
      + '<button class="x" id="mx">×</button>';
    $("modal").querySelector('.body').innerHTML =
      '<div class="grp">보유 권한 '+num(roles.length)+'종</div>'
      + (roles.length
          ? Object.keys(g).map(k => '<div class="grp">'+esc(k)+'</div>'
              + g[k].map(r => '<span class="chip" data-rid="'+esc(r.role_id)+'" title="'+esc(r.role_id)+' — 눌러서 메뉴 권한 보기">'
                  + esc(r.role_label || r.role_nm)
                  + '<span class="w">메뉴 '+num(r.menu_cnt)+'</span>'
                  + (r.is_write ? '<span class="w">쓰기</span>' : '')+'</span>').join('')).join('')
          : '<div class="notice">보유한 ERP 권한이 없습니다.</div>');
    $("modal").querySelectorAll('.chip[data-rid]').forEach(c =>
      c.onclick = () => openRole(c.dataset.rid));
    bindModalClose();
  }

  function bindModalClose(){
    const close = () => { $("modal").innerHTML = ''; document.removeEventListener('keydown', onEsc); };
    const onEsc = (e) => { if(e.key === 'Escape') close(); };
    const x = $("mx"); if(x) x.onclick = close;
    const ov = $("modal").querySelector('.ov');
    if(ov) ov.onclick = (e) => { if(e.target === ov) close(); };
    document.addEventListener('keydown', onEsc);
  }

  /* ── CSV — UTF-8 BOM (엑셀 한글 깨짐 방지, §13.5) ── */
  function csvCell(v){ const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  function download(name, rows){
    const blob = new Blob(["﻿" + rows.map(r => r.map(csvCell).join(',')).join('\r\n')],
                          { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const stamp  = () => new Date().toISOString().slice(0,10).replace(/-/g,'');
  const deptNm = () => (DETAIL && DETAIL.dept && DETAIL.dept.dept_nm) || SEL || '';
  function exportMembers(rows){
    const out = [['부서','이름','직책','ROLE ID','ROLE명','모듈','쓰기']];
    rows.forEach(mm => (mm.roles || []).forEach(r => out.push([
      mm.dept_nm || deptNm(), mm.emp_nm, mm.title || '',
      r.role_id, r.role_nm, r.module_label || '', r.is_write ? '쓰기' : '조회'])));
    download('ERP권한_구성원_'+deptNm()+'_'+stamp()+'.csv', out);
  }
  function exportMatrix(mem, roles){
    const out = [['ROLE ID','ROLE명','모듈','보유'].concat(mem.map(m => m.emp_nm || m.email))];
    roles.forEach(({ r, holders }) => out.push(
      [r.role_id, r.role_nm, r.module_label || '', Object.keys(holders).length]
        .concat(mem.map(m => holders[m.email] ? 'O' : ''))));
    download('ERP권한_매트릭스_'+deptNm()+'_'+stamp()+'.csv', out);
  }
  function exportRoleList(list){
    const out = [['ROLE ID','ROLE명','모듈','사용자','메뉴','민감']];
    list.forEach(r => out.push([r.role_id, r.role_nm, r.module_label || '',
                                r.user_cnt, r.menu_cnt, r.sensitive ? '민감' : '']));
    download('ERP권한_목록_'+(ROLEDEPT ? deptNm()+'_' : '전사_')+stamp()+'.csv', out);
  }

  boot();
</script>
</body></html>
